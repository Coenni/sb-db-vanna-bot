services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: vanna-postgres
    environment:
      POSTGRES_DB: vanna_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - vanna-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vanna AI Microservice
  vanna-service:
    build:
      context: ./vanna-service
      dockerfile: Dockerfile
    container_name: vanna-service
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your-openai-api-key}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-3.5-turbo}
      CHROMADB_PATH: /app/chromadb
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: vanna_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - vanna-chromadb:/app/chromadb
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vanna-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vanna-backend
    environment:
      VANNA_SERVICE_URL: http://vanna-service:5000
      FRONTEND_URL: http://localhost:4200
    ports:
      - "8080:8080"
    depends_on:
      - vanna-service
    networks:
      - vanna-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Angular Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vanna-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - vanna-network

networks:
  vanna-network:
    driver: bridge

volumes:
  postgres-data:
  vanna-chromadb:
